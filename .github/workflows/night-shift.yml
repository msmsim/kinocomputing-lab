name: Night shift

# The lab's nightly run (README.md): prepare the briefing and budget, let the
# agent work one shift, then settle — record the spend, check the rules, and
# publish the outbox to kinocomputing.
#
# Credentials are kept apart on purpose. The agent's step holds only the
# Anthropic key. Neither checkout persists credentials, and kinocomputing is
# checked out only after the agent has finished, so nothing the agent reads —
# web pages, papers, the PI's linked material — can push anything anywhere.
#
# Pause the lab by setting the repository variable LAB_PAUSED to "true".

on:
  schedule:
    # Two shifts a day (README, "A night"): breadth, then depth. GitHub can
    # delay or drop a scheduled run when it's busy, worst on the hour, and
    # the on-time trigger is the outside scheduler below; these are backups,
    # each working its shift only if that shift hasn't settled today (the
    # check job below). The times say which shift a schedule is for.
    - cron: "23 2 * * *"   # shift 1
    - cron: "41 3 * * *"   # shift 1, backup
    - cron: "7 5 * * *"    # shift 2
    - cron: "29 6 * * *"   # shift 2, backup
  # By hand, or nightly from an outside scheduler (cron-job.org: shift 1 at
  # 02:23 UTC, shift 2 at 05:07), which starts on time where GitHub's own can
  # run hours late. The outside one sends `nightly: true`, so it stands down
  # like a schedule would.
  workflow_dispatch:
    inputs:
      nightly:
        description: "Started by the nightly scheduler: stand down if this shift has settled today"
        type: boolean
        default: false
      shift:
        description: "Which of the day's shifts: 1 (breadth) or 2 (depth)"
        type: choice
        options: ["1", "2"]
        default: "1"

concurrency:
  group: night-shift
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Each shift once a day. A scheduled run, or the nightly scheduler's
  # dispatch, stands down if its shift has already settled today (UTC); the
  # second shift also waits for the first, since it starts from what the
  # first found. The concurrency group above makes a backup wait for a shift
  # still running, so it sees that shift's settle. A run started by hand
  # always goes ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      shift: ${{ steps.check.outputs.shift }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            state/last-settle.json
            tools/check-shift.sh
          sparse-checkout-cone-mode: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          NIGHTLY: ${{ inputs.nightly }}
          ASKED: ${{ inputs.shift }}
        run: bash tools/check-shift.sh state/last-settle.json "$(date -u +%F)" >> "$GITHUB_OUTPUT"

  shift:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A Sunday's second shift has a 120-minute clock (config/lab.json, sunday).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history: a Sunday's week in review reads the week's commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code@2.1.325
          # Charts in the house style (config/house/house.mplstyle).
          python3 -m pip install --quiet --user matplotlib

      - name: Prepare
        id: prep
        env:
          # Whether the lab has an Exa key: prepare gives Exa a slice of the
          # night's budget only then. The key itself isn't in this step.
          EXA_CONFIGURED: ${{ secrets.EXA_API_KEY != '' }}
          LAB_SHIFT: ${{ needs.check.outputs.shift }}
        run: |
          node tools/prepare.mjs
          echo "skip=$(jq -r .skip state/run.json)" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r .model state/run.json)" >> "$GITHUB_OUTPUT"
          echo "max_usd=$(jq -r .max_usd state/run.json)" >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r .date state/run.json)" >> "$GITHUB_OUTPUT"

      - name: Shift
        if: steps.prep.outputs.skip != 'true' && vars.LAB_PAUSED != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. tools/search.mjs meters it against tonight's allowance;
          # the key's own limit in Exa's dashboard is the backstop.
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # Optional: Semantic Scholar's own rate, rather than its busy public pool.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          MODEL: ${{ steps.prep.outputs.model }}
          MAX_USD: ${{ steps.prep.outputs.max_usd }}
        run: |
          set +e
          node tools/timebox.mjs "$(( $(jq -r .minutes state/run.json) * 60 ))" claude -p "Read AGENT.md and work tonight's shift. Your briefing is state/tonight.md." \
            --model "$MODEL" \
            --max-budget-usd "$MAX_USD" \
            --output-format json \
            --permission-mode acceptEdits \
            --allowedTools "Read Write Edit Glob Grep Bash WebFetch WebSearch Task Agent" \
            < /dev/null > state/claude-output.json
          code=$?
          echo "SHIFT_EXIT=$code" >> "$GITHUB_ENV"
          [ "$code" = 0 ] || echo "the shift exited $code; settling what it left"

      # From here on a failure mustn't cost the night: the restore runs
      # whatever happened before it, and a rerun that fails or overruns is
      # recorded but doesn't stop the settle. Settle itself still needs the
      # restore to have succeeded: it must never run tools the agent changed.
      #
      # The agent worked in this checkout. Before anything trusts the lab's
      # tools again, put them back as committed; settle reports what changed.
      - name: Restore the machinery
        if: ${{ !cancelled() }}
        run: bash tools/restore-machinery.sh

      # Experiments with a new result run again on another seed. The agent's
      # own code, so no secrets in this step — replicate.mjs passes it only
      # PATH and HOME — and it runs before kinocomputing is checked out.
      - name: Replicate
        if: steps.prep.outputs.skip != 'true' && vars.LAB_PAUSED != 'true'
        timeout-minutes: 35
        continue-on-error: true
        run: node tools/replicate.mjs

      - uses: actions/checkout@v4
        with:
          repository: msmsim/kinocomputing
          path: kinocomputing
          token: ${{ secrets.KINO_PUSH_TOKEN }}
          persist-credentials: false

      - name: Settle
        id: settle
        env:
          KINO_DIR: kinocomputing
        # A settle that fails still lets the night be committed and published
        # as far as it got; the run turns red at the end ("Settle failed").
        run: |
          set +e
          node tools/settle.mjs | tee settle.log
          code=${PIPESTATUS[0]}
          set -e
          echo "SETTLE_EXIT=$code" >> "$GITHUB_ENV"
          if [ "$code" = 0 ]; then
            echo "summary=$(tail -1 settle.log | sed 's/^settle: //')" >> "$GITHUB_OUTPUT"
          else
            echo "summary=$(bash tools/settle-failed.sh "$code")" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the lab
        env:
          TOKEN: ${{ github.token }}
          DATE: ${{ steps.prep.outputs.date }}
          SHIFT: ${{ needs.check.outputs.shift }}
          SUMMARY: ${{ steps.settle.outputs.summary }}
        run: |
          git config user.name "kinocomputing-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!kinocomputing' ':!settle.log'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "night shift $DATE (shift $SHIFT): $SUMMARY"
          # The PI may have pushed during the shift: rebase onto it, never lose it.
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:main; then exit 0; fi
            git pull --rebase "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" main
          done
          echo "could not push the lab after 3 attempts"; exit 1

      - name: Publish to kinocomputing
        env:
          TOKEN: ${{ secrets.KINO_PUSH_TOKEN }}
          SUMMARY: ${{ steps.settle.outputs.summary }}
        working-directory: kinocomputing
        run: |
          # notes/ and media/: everything settle writes into kinocomputing.
          if [ -z "$(git status --porcelain notes media)" ]; then echo "nothing to publish"; exit 0; fi
          git config user.name "kinocomputing-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes media
          git commit -m "lab: $SUMMARY"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${TOKEN}@github.com/msmsim/kinocomputing" HEAD:main; then exit 0; fi
            git pull --rebase "https://x-access-token:${TOKEN}@github.com/msmsim/kinocomputing" main
          done
          echo "could not publish after 3 attempts"; exit 1

      # A night that couldn't be committed (a step failed, the job timed out
      # or was cancelled, a push was refused) is kept as a download on the
      # run's page for 30 days, to be restored by hand. Uses the runner's own
      # artifact token; nothing the agent's step could reach.
      - name: Keep the night's work if it wasn't committed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-night-${{ github.run_id }}
          path: |
            drafts/
            outbox/
            published/
            journal/
            MORNING.md
            state/
            experiments/
            analyses/
            sources/
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: false

      # Last, after the night is committed and published: a failed settle
      # turns the run red, so it's seen.
      - name: Settle failed
        if: ${{ !cancelled() && env.SETTLE_EXIT != '' && env.SETTLE_EXIT != '0' }}
        run: |
          echo "settle exited $SETTLE_EXIT; the night was committed and published as far as it got"
          exit 1
