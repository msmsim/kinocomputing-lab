name: Tests

# Every change to the lab's machinery runs the tests (npm test: about ten
# seconds), then the mutants that change could have affected (test/mutants.mjs
# --since: usually seconds), with their result on the run's summary. The
# whole list of mutants runs weekly. The nights' own commits change state,
# not machinery, so they don't trigger it. The tests render through
# kinocomputing's real templates and build, so the site is checked out beside
# the lab, read-only.
#
# The night shift's proposals (README, "Proposals") come here too: it runs
# this workflow, main's copy, with the proposal's branch and the commit it
# started from. The tests and the mutants run on the proposal's code with
# read-only rights; then the fast-lane job, main's, judges the change with
# main's tools/fast-lane.mjs and merges it, or leaves it for the PI. A
# proposal's own copy of this file never runs.
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "test/**"
      - "config/**"
      - "voices/**"
      - "AGENT.md"
      - "CHARTER.md"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/**"
  pull_request:
  schedule:
    - cron: "17 12 * * 6"   # Saturdays: every mutant
  workflow_dispatch:
    inputs:
      proposal:
        description: "A proposal branch to test and judge (proposal/…); empty for main"
        type: string
        default: ""
      since:
        description: "The commit the proposal started from"
        type: string
        default: ""

concurrency:
  group: tests-${{ github.ref }}-${{ inputs.proposal || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested: ${{ steps.tested.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A proposal's code, when there is one; main's otherwise.
          ref: ${{ inputs.proposal || '' }}
          # The history, so the mutants can see what this push changed.
          fetch-depth: 0

      - id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: msmsim/kinocomputing
          path: kinocomputing
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The spec report in the log; a TAP copy, from which each failing test
      # becomes an annotation on the run's page, readable without the log.
      # The lab's oracle (test/oracle.test.mjs): a few generated histories on
      # a fixed seed on a push; sixty on a fresh seed on Saturdays.
      - name: Test
        env:
          KINO_DIR: ${{ github.workspace }}/kinocomputing
          LAB_ORACLE_RUNS: ${{ github.event_name == 'schedule' && '60' || '3' }}
          LAB_ORACLE_SEED: ${{ github.event_name == 'schedule' && github.run_id || '1' }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=tap.txt test/*.test.mjs

      - name: Say which tests failed
        if: failure()
        run: node tools/tap-annotate.mjs tap.txt

      # A push or pull request: the mutants its change could have affected. A
      # Saturday, or by hand: every one. Either way the verdict is on the
      # run's summary page.
      - name: Mutants
        env:
          KINO_DIR: ${{ github.workspace }}/kinocomputing
          BASE: ${{ inputs.since || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
          EVENT: ${{ github.event_name }}
          PROPOSAL: ${{ inputs.proposal }}
        run: |
          set -o pipefail
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ -z "$PROPOSAL" ]; }; then
            scope=()
          else
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
            scope=(--since "$BASE")
          fi
          node test/mutants.mjs "${scope[@]}" | tee mutants.log
          { echo '### Mutants'; echo '```'; grep -vE '^✓  killed' mutants.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # A proposal the tests and mutants passed: main's own judge decides whether
  # it may merge itself (tools/fast-lane.mjs), and merges exactly the commit
  # that was tested; anything else is labelled for the PI, with why.
  fast-lane:
    needs: test
    if: ${{ inputs.proposal != '' && startsWith(inputs.proposal, 'proposal/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Judge
        id: judge
        env:
          SINCE: ${{ inputs.since }}
          TESTED: ${{ needs.test.outputs.tested }}
        run: |
          git fetch -q origin "$TESTED"
          node tools/fast-lane.mjs "$SINCE" "$TESTED" | tee -a "$GITHUB_OUTPUT"

      - name: Merge, or leave for the PI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.proposal }}
          TESTED: ${{ needs.test.outputs.tested }}
          FAST: ${{ steps.judge.outputs.fast }}
          WHY: ${{ steps.judge.outputs.why }}
        run: |
          if [ "$FAST" = true ]; then
            gh pr merge "$BRANCH" --repo "$REPO" --squash --delete-branch --match-head-commit "$TESTED"
            echo "Merged by the fast lane: $WHY" >> "$GITHUB_STEP_SUMMARY"
          else
            gh label create "for the PI" --repo "$REPO" --color d93f0b --description "A night-shift proposal the fast lane leaves for the PI" --force
            gh pr edit "$BRANCH" --repo "$REPO" --add-label "for the PI"
            gh pr comment "$BRANCH" --repo "$REPO" --body "Tests and mutants passed. Left for the PI: $WHY."
            echo "Left for the PI: $WHY" >> "$GITHUB_STEP_SUMMARY"
          fi
